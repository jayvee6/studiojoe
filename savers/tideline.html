<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tideline — WebGPU Saver</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  /* Scope canvas rule to the WebGPU canvas ONLY.
     A bare `canvas{}` rule also matches the HUD sparkline canvas and stretches
     its 138x30 bitmap to the full viewport (blackhole lesson 3). */
  #gpu-canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="gpu-canvas"></canvas>

<script src="../lib/sj-hud.js"></script>
<script src="../lib/sj-controls.js"></script>
<script type="module">
// ===========================================================================
// Tideline — standalone WebGPU port of StudioJoeSavers/Tideline.metal
// Build: sv-tideline-001
//
// Hard-won lessons carried over verbatim from blackhole.html:
//   1. requestAdapter/requestDevice in try/catch — null adapter ≠ throw.
//   2. getCompilationInfo / compilationInfo dual-guard before pipeline creation.
//   3. CSS scope: #gpu-canvas only — never a bare `canvas{}` rule.
//   4. No backtick characters ANYWHERE inside the WGSL template literal.
//   5. No atan2 seam introduced in tiled noise (Tideline is 2D FBM — just port
//      it straight without any angular-coordinate tricks).
//   6. Never re-implement EMA perf stats — sj-hud.js owns that.
//
// Uniform ABI — 48 bytes (multiple of 16), vec2<f32> on 8-byte boundary:
//
//   offset  field        bytes  WGSL type
//   0       time         4      f32
//   4       _pad0        4      f32   (aligns resolution to 8)
//   8       resolution   8      vec2<f32>
//   16      speed        4      f32   (control: JS time multiplier — not used in shader)
//   20      warp         4      f32   (control: domain-warp scale)
//   24      hueDrift     4      f32   (control: hue-cycle rate scale)
//   28      iris         4      f32   (control: iridescent palette amplitude)
//   32      edr          4      f32   (control: EDR peak boost scale)
//   36      vignette     4      f32   (control: vignette strength)
//   40      _pad1        4      f32
//   44      _pad2        4      f32
//   -- 48 bytes total --
//
// Float32Array packing (12 slots):
//   uni[0]=elapsed  uni[1]=0  uni[2]=W  uni[3]=H
//   uni[4]=speed    uni[5]=warp  uni[6]=hueDrift  uni[7]=iris
//   uni[8]=edr      uni[9]=vignette  uni[10]=0  uni[11]=0
// ===========================================================================

const BUILD = 'sv-tideline-001';
const canvas = document.getElementById('gpu-canvas');

// ---- WGSL -----------------------------------------------------------------
// NOTE: this whole string is a JS template literal. Absolutely no backtick
// characters anywhere inside it (including comments) or the build dies.
const WGSL = /* wgsl */`

// 48 bytes — time@0, _pad0@4, resolution@8 (8-byte aligned), controls@16.
// Total is a multiple of 16. vec2<f32> sits on an 8-byte boundary.
struct U {
    time:       f32,         // 0   elapsed seconds (js-managed, speed applied)
    _pad0:      f32,         // 4   alignment pad (keeps resolution 8-byte aligned)
    resolution: vec2<f32>,   // 8
    speed:      f32,         // 16  (not used in shader; time already scaled in JS)
    warp:       f32,         // 20  domain-warp displacement multiplier
    hueDrift:   f32,         // 24  hue-cycle rate scale
    iris:       f32,         // 28  iridescent palette amplitude scale
    edr:        f32,         // 32  EDR peak boost scale
    vignette:   f32,         // 36  vignette strength
    _pad1:      f32,         // 40
    _pad2:      f32,         // 44
}
@group(0) @binding(0) var<uniform> u: U;

struct VSOut {
    @builtin(position) pos: vec4<f32>,
    @location(0)       uv:  vec2<f32>,
}

// Full-screen triangle — exactly three coverage vertices.
// UV goes [0..1] over the visible quad, mirroring Metal:
//   out.uv = (positions[vid] + 1.0) * 0.5
@vertex fn vs_main(@builtin(vertex_index) vid: u32) -> VSOut {
    var p = array<vec2<f32>, 3>(
        vec2<f32>(-1.0, -1.0),
        vec2<f32>( 3.0, -1.0),
        vec2<f32>(-1.0,  3.0),
    );
    var uvs = array<vec2<f32>, 3>(
        vec2<f32>(0.0, 0.0),
        vec2<f32>(2.0, 0.0),
        vec2<f32>(0.0, 2.0),
    );
    var o: VSOut;
    o.pos = vec4<f32>(p[vid], 0.0, 1.0);
    o.uv  = uvs[vid];
    return o;
}

// ---- hash21 (from SharedUtilities.h) ----------------------------------------
// 2D value hash -> scalar [0,1].
fn hash21(p_in: vec2<f32>) -> f32 {
    var p = fract(p_in * vec2<f32>(123.34, 456.21));
    p = p + vec2<f32>(dot(p, p + vec2<f32>(34.345)));
    return fract(p.x * p.y);
}

// ---- noise2 (from SharedUtilities.h) ----------------------------------------
// 2D smooth value noise -> [0,1].
fn noise2(p: vec2<f32>) -> f32 {
    let i = floor(p);
    let f = fract(p);
    let uu = f * f * (vec2<f32>(3.0) - 2.0 * f);
    let a = hash21(i);
    let b = hash21(i + vec2<f32>(1.0, 0.0));
    let c = hash21(i + vec2<f32>(0.0, 1.0));
    let d = hash21(i + vec2<f32>(1.0, 1.0));
    return mix(mix(a, b, uu.x), mix(c, d, uu.x), uu.y);
}

// ---- fbm2 -------------------------------------------------------------------
// 5-octave FBM matching Tideline.metal static float fbm2(float2 p).
fn fbm2(p_in: vec2<f32>) -> f32 {
    var p = p_in;
    var v = 0.0;
    var a = 0.5;
    for (var i: i32 = 0; i < 5; i = i + 1) {
        v = v + a * noise2(p);
        p = p * 2.02;
        a = a * 0.5;
    }
    return v;
}

// ---- iridescent -------------------------------------------------------------
// Cosine-gradient palette (Inigo Quilez method).
// Verbatim from Tideline.metal static float3 iridescent(float t).
// u.iris scales the b coefficient amplitude.
fn iridescent(t: f32) -> vec3<f32> {
    let a = vec3<f32>(0.55, 0.45, 0.55);
    let b = vec3<f32>(0.45, 0.50, 0.50) * u.iris;
    let c = vec3<f32>(1.00, 1.00, 1.00);
    let d = vec3<f32>(0.00, 0.20, 0.55);
    return a + b * cos(6.2831853 * (c * t + d));
}

// ---- Fragment ---------------------------------------------------------------
@fragment fn fs_main(in: VSOut) -> @location(0) vec4<f32> {

    // Coordinate derivation: verbatim 1:1 with Tideline.metal fragment.
    //   p = in.uv * 2.0 - 1.0
    //   p.x *= resolution.x / max(resolution.y, 1.0)
    var p = in.uv * 2.0 - vec2<f32>(1.0);
    p.x = p.x * (u.resolution.x / max(u.resolution.y, 1.0));

    // Two-level domain warp. u.warp scales the 3.5 displacement factors.
    let t = u.time * 0.06;
    let warp_scale = 3.5 * u.warp;
    let q = vec2<f32>(
        fbm2(p * 1.4 + vec2<f32>(0.0,       t)),
        fbm2(p * 1.4 + vec2<f32>(5.2, 1.3 + t)),
    );
    let r = vec2<f32>(
        fbm2(p + warp_scale * q + vec2<f32>(1.7, 9.2 + t * 1.4)),
        fbm2(p + warp_scale * q + vec2<f32>(8.3, 2.8 + t * 1.7)),
    );
    let v = fbm2(p + warp_scale * r);

    // Hue drift — u.hueDrift scales the 0.013 rate constant.
    var col = iridescent(v + u.time * 0.013 * u.hueDrift);

    // Small darkening based on warp depth — verbatim from Metal.
    // The 0.55 warp-depth factor is fixed (aesthetic ground truth).
    col = col * (0.55 + 0.45 * length(r));

    // EDR peak boost. saturate(x) -> clamp(x,0,1) in WGSL.
    // u.edr scales the 1.6 boost coefficient.
    col = col + vec3<f32>(0.4, 0.5, 0.6) * pow(clamp(v, 0.0, 1.0), 12.0) * 1.6 * u.edr;

    // Hash-based output dither (verbatim from Metal — uses @builtin(position)
    // pixel coords, same as Metal in.position.xy).
    let dither = fract(sin(dot(in.pos.xy, vec2<f32>(12.9898, 78.233))) * 43758.5453);
    col = col + (dither - 0.5) / 255.0;

    // Vignette — u.vignette scales the 0.25 coefficient.
    let vig = 1.0 - 0.25 * u.vignette * smoothstep(1.4, 2.05, length(p));

    return vec4<f32>(col * vig, 1.0);
}
`;

// ---- HUD ------------------------------------------------------------------
const hud = window.SJHud.createHud({
  title:  'Tideline',
  build:  BUILD,
  canvas: canvas,
  help:   ['console: window.tide.*'],
  lines:  [],
});

// ---- Controls -------------------------------------------------------------
let elapsed = 0.0;

const ctrl = window.SJControls.create({
  title: 'Tideline',
  build: BUILD,
  ns: 'tide',
  controls: [
    { id: 'speed',    label: 'Speed',     type: 'slider', min: 0,   max: 3,   step: 0.01, default: 1.0  },
    { id: 'warp',     label: 'Warp',      type: 'slider', min: 0,   max: 2,   step: 0.01, default: 1.0  },
    { id: 'hueDrift', label: 'Hue Drift', type: 'slider', min: 0,   max: 3,   step: 0.01, default: 1.0  },
    { id: 'iris',     label: 'Iris',      type: 'slider', min: 0,   max: 2,   step: 0.01, default: 1.0  },
    { id: 'edr',      label: 'EDR',       type: 'slider', min: 0,   max: 3,   step: 0.01, default: 1.0  },
    { id: 'vignette', label: 'Vignette',  type: 'slider', min: 0,   max: 1.5, step: 0.01, default: 1.0  },
    { id: 'paused',   label: 'Paused',    type: 'toggle', default: false },
    { id: 'restart',  label: 'Restart',   type: 'button', onClick: () => { elapsed = 0.0; } },
  ],
});

// ---- Boot -----------------------------------------------------------------
async function main() {
  if (!navigator.gpu) {
    hud.report('WebGPU unavailable',
      'navigator.gpu is undefined. Needs Chrome/Edge 113+, Safari 18+, or Firefox Nightly with WebGPU enabled.');
    return;
  }

  let adapter = null;
  try { adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }); }
  catch (e) { hud.report('requestAdapter() threw', (e && e.stack) || String(e)); return; }
  if (!adapter) {
    hud.report('No GPU adapter',
      'navigator.gpu.requestAdapter() returned null. The GPU may be blocklisted, or other WebGPU tabs are holding all adapters — close them and reload.');
    return;
  }

  let device;
  try { device = await adapter.requestDevice(); }
  catch (e) { hud.report('requestDevice() failed', (e && e.stack) || String(e)); return; }

  device.lost.then(info =>
    hud.report('GPU device lost', info.reason + ' — ' + info.message));
  device.addEventListener('uncapturederror', ev => {
    console.error('[tideline] uncaptured GPU error:', ev.error);
    hud.report('GPU validation error', String((ev.error && ev.error.message) || ev.error));
  });

  const ctx = canvas.getContext('webgpu');
  if (!ctx) { hud.report('No WebGPU canvas context', "canvas.getContext('webgpu') returned null."); return; }

  const format = navigator.gpu.getPreferredCanvasFormat();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    canvas.width  = Math.floor(window.innerWidth  * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.configure({ device, format, alphaMode: 'opaque' });
  }
  resize();
  window.addEventListener('resize', resize);

  // Compile shader and guard for errors.
  const module = device.createShaderModule({ label: 'Tideline', code: WGSL });

  // Chrome renamed compilationInfo() -> getCompilationInfo(); support both.
  // Calling a missing method unconditionally throws and masks the real error.
  const ciFn = module.getCompilationInfo ? module.getCompilationInfo.bind(module)
             : module.compilationInfo    ? module.compilationInfo.bind(module)
             : null;
  if (ciFn) {
    const info = await ciFn();
    const msgs = (info && info.messages) || [];
    const errs = msgs.filter(m => m.type === 'error');
    if (msgs.length) {
      console[errs.length ? 'error' : 'warn']('[tideline] WGSL messages:\n' +
        msgs.map(m => m.type + ' L' + m.lineNum + ':' + m.linePos + '  ' + m.message).join('\n'));
    }
    if (errs.length) {
      hud.report('WGSL compile error',
        errs.map(m => 'L' + m.lineNum + ':' + m.linePos + '  ' + m.message).join('\n'));
      return;
    }
  }

  // 48-byte uniform buffer.
  // Slot layout (12 x f32):
  //   [0]=time [1]=_pad0=0 [2]=res.x [3]=res.y
  //   [4]=speed [5]=warp [6]=hueDrift [7]=iris [8]=edr [9]=vignette [10]=0 [11]=0
  const UNIFORM_BYTES = 48;
  const uni = new Float32Array(UNIFORM_BYTES / 4);  // 12 f32 slots
  const uniformBuf = device.createBuffer({
    size:  UNIFORM_BYTES,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });

  const bgl = device.createBindGroupLayout({
    entries: [{ binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } }],
  });
  const bindGroup = device.createBindGroup({
    layout: bgl,
    entries: [{ binding: 0, resource: { buffer: uniformBuf } }],
  });

  const pipeline = device.createRenderPipeline({
    label:  'Tideline',
    layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
    vertex:   { module, entryPoint: 'vs_main' },
    fragment: { module, entryPoint: 'fs_main', targets: [{ format }] },
    primitive: { topology: 'triangle-list' },
  });

  let lastT = performance.now();

  function renderFrame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    // Time model: elapsed accumulates only when not paused, scaled by speed.
    const paused    = ctrl.value('paused');
    const speed     = ctrl.value('speed');
    const warp      = ctrl.value('warp');
    const hueDrift  = ctrl.value('hueDrift');
    const iris      = ctrl.value('iris');
    const edr       = ctrl.value('edr');
    const vignette  = ctrl.value('vignette');

    if (!paused) elapsed += dt * speed;

    // Pack uniform buffer — order MUST match WGSL struct field order.
    uni[0]  = elapsed;          // time
    uni[1]  = 0.0;              // _pad0
    uni[2]  = canvas.width;    // resolution.x
    uni[3]  = canvas.height;   // resolution.y
    uni[4]  = speed;            // speed  (unused in shader; time already scaled in JS)
    uni[5]  = warp;             // warp
    uni[6]  = hueDrift;         // hueDrift
    uni[7]  = iris;             // iris
    uni[8]  = edr;              // edr
    uni[9]  = vignette;         // vignette
    uni[10] = 0.0;              // _pad1
    uni[11] = 0.0;              // _pad2
    device.queue.writeBuffer(uniformBuf, 0, uni);

    const enc  = device.createCommandEncoder();
    const pass = enc.beginRenderPass({
      colorAttachments: [{
        view:       ctx.getCurrentTexture().createView(),
        loadOp:     'clear',
        storeOp:    'store',
        clearValue: { r: 0, g: 0, b: 0, a: 1 },
      }],
    });
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bindGroup);
    pass.draw(3);
    pass.end();
    device.queue.submit([enc.finish()]);

    hud.tick(now);
  }

  function frame(now) {
    try { renderFrame(now); }
    catch (e) { hud.report('Render-loop exception', (e && e.stack) || String(e)); return; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

main().catch(err => {
  console.error('[tideline] init failed:', err);
  hud.report('Init exception', (err && err.stack) || String(err));
});
</script>
<script src="../lib/sj-capture.js"></script>

<script>
// Studio Joe — back-link (hidden when this page is loaded inside an iframe
// preview on /savers.html). Plain DOM, no innerHTML; near-opaque scrim only
// so it stays legible over the animating canvas.
(function () {
  if (window.top !== window.self) return;
  var a = document.createElement("a");
  a.href = "/savers.html";
  a.textContent = "← Savers";
  Object.assign(a.style, {
    position: "fixed", top: "14px", right: "14px", zIndex: "2147483646",
    color: "rgba(255,255,255,0.55)", textDecoration: "none",
    font: "11px/1 ui-monospace, SF Mono, SFMono-Regular, Menlo, monospace",
    background: "rgba(6,6,8,0.82)",
    padding: "8px 13px", borderRadius: "10px",
    border: "1px solid rgba(255,255,255,0.10)",
    transition: "color .15s, border-color .15s",
  });
  a.addEventListener("mouseenter", function () {
    a.style.color = "rgba(255,255,255,0.92)";
    a.style.borderColor = "rgba(255,255,255,0.3)";
  });
  a.addEventListener("mouseleave", function () {
    a.style.color = "rgba(255,255,255,0.55)";
    a.style.borderColor = "rgba(255,255,255,0.10)";
  });
  document.body.appendChild(a);
})();
</script>
</body>
