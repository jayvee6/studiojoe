<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plasma — WebGPU Saver</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  /* Scope canvas rule to the WebGPU canvas ONLY.
     A bare `canvas{}` rule also matches the HUD sparkline canvas and stretches
     its 138x30 bitmap to the full viewport (blackhole lesson 3). */
  #gpu-canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="gpu-canvas"></canvas>

<script src="../lib/sj-hud.js"></script>
<script src="../lib/sj-controls.js"></script>
<script type="module">
// ===========================================================================
// Plasma — standalone WebGPU port of StudioJoeSavers/Plasma.metal
// Build: sv-plasma-001
//
// Hard-won lessons carried over verbatim from blackhole.html / tideline.html:
//   1. requestAdapter/requestDevice in try/catch — null adapter != throw.
//   2. getCompilationInfo / compilationInfo dual-guard before pipeline creation.
//   3. CSS scope: #gpu-canvas only — never a bare `canvas{}` rule.
//   4. No backtick characters ANYWHERE inside the WGSL template literal.
//   5. MSL struct selection (if/else) — WGSL select() does not work on structs.
//   6. Never re-implement EMA perf stats — sj-hud.js owns that.
//
// Uniform ABI — 64 bytes (multiple of 16), vec2<f32> on 8-byte boundary:
//
//   offset  field         bytes  WGSL type   source
//   0       time          4      f32         Metal: float time
//   4       _pad0         4      f32         alignment pad (aligns resolution to 8)
//   8       resolution    8      vec2<f32>   Metal: float2 resolution
//   16      timeOfDay     4      f32         Metal: float timeOfDay
//   20      deepFreq      4      f32         control: deep-layer spatial freq scale
//   24      deepSpeed     4      f32         control: deep-layer temporal rate scale
//   28      brightFreq    4      f32         control: bright-layer spatial freq scale
//   32      brightSpeed   4      f32         control: bright-layer temporal rate scale
//   36      iris          4      f32         control: thin-film iridescence shift gain
//   40      absorb        4      f32         control: volume-absorption strength
//   44      silk          4      f32         control: anisotropic silk specular gain
//   48      chroma        4      f32         control: chromatic-aberration amount
//   52      vignette      4      f32         control: vignette strength
//   56      _pad1         4      f32         alignment pad
//   60      _pad2         4      f32         alignment pad
//   -- 64 bytes total --
//
// Float32Array packing (16 slots):
//   uni[0]=time       uni[1]=0           uni[2]=W          uni[3]=H
//   uni[4]=timeOfDay  uni[5]=deepFreq    uni[6]=deepSpeed   uni[7]=brightFreq
//   uni[8]=brightSpeed  uni[9]=iris      uni[10]=absorb     uni[11]=silk
//   uni[12]=chroma    uni[13]=vignette   uni[14]=0          uni[15]=0
// ===========================================================================

const BUILD = 'sv-plasma-001';
const canvas = document.getElementById('gpu-canvas');

// ---- WGSL -----------------------------------------------------------------
// NOTE: this whole string is a JS template literal. Absolutely no backtick
// characters anywhere inside it (including comments) or the build dies.
const WGSL = /* wgsl */`

// 64 bytes — time@0, _pad0@4, resolution@8 (8-byte aligned), timeOfDay@16,
// controls@20..52, _pad1@56, _pad2@60. Total is a multiple of 16.
// vec2<f32> sits on an 8-byte boundary.
struct U {
    time:        f32,         // 0   elapsed seconds (js-managed, speed applied)
    _pad0:       f32,         // 4   alignment pad (keeps resolution 8-byte aligned)
    resolution:  vec2<f32>,   // 8
    timeOfDay:   f32,         // 16  0..1: 0=midnight, 0.25=sunrise, 0.5=noon, 0.75=sunset
    deepFreq:    f32,         // 20  scale deep-layer spatial freqs (1.55/2.10/1.25)
    deepSpeed:   f32,         // 24  scale deep-layer temporal rates (0.42/0.55/0.34)
    brightFreq:  f32,         // 28  scale bright-layer spatial freqs (4.40/5.40/3.30/6.5)
    brightSpeed: f32,         // 32  scale bright-layer temporal rates (1.30/1.55/1.05/1.7)
    iris:        f32,         // 36  thin-film iridescence shift gain
    absorb:      f32,         // 40  volume-absorption strength
    silk:        f32,         // 44  anisotropic silk specular gain
    chroma:      f32,         // 48  chromatic-aberration amount
    vignette:    f32,         // 52  vignette strength
    _pad1:       f32,         // 56
    _pad2:       f32,         // 60
}
@group(0) @binding(0) var<uniform> u: U;

struct VSOut {
    @builtin(position) pos: vec4<f32>,
    @location(0)       uv:  vec2<f32>,
}

// Full-screen triangle -- exactly three coverage vertices.
// UV goes [0..1] over the visible quad, mirroring Metal:
//   out.uv = (positions[vid] + 1.0) * 0.5
@vertex fn vs_main(@builtin(vertex_index) vid: u32) -> VSOut {
    var p = array<vec2<f32>, 3>(
        vec2<f32>(-1.0, -1.0),
        vec2<f32>( 3.0, -1.0),
        vec2<f32>(-1.0,  3.0),
    );
    var uvs = array<vec2<f32>, 3>(
        vec2<f32>(0.0, 0.0),
        vec2<f32>(2.0, 0.0),
        vec2<f32>(0.0, 2.0),
    );
    var o: VSOut;
    o.pos = vec4<f32>(p[vid], 0.0, 1.0);
    o.uv  = uvs[vid];
    return o;
}

// ---- Plasma height fields ---------------------------------------------------
//
// Two layers fed into a domain-warped composite. The deep layer is slow and
// low-frequency -- it provides the macroscopic flow field and also acts as the
// warping vector for the bright layer. The bright layer is faster and higher-
// frequency, evaluated at the warped coordinates so it gets dragged through the
// deep layer currents. Result: the two are mathematically intertwined into one
// fluid, not just stacked.

fn plasmaDeep(p: vec2<f32>, t: f32) -> f32 {
    var v = 0.0;
    v = v + sin(p.x * 1.55 * u.deepFreq + t * 0.42 * u.deepSpeed);
    v = v + sin(p.y * 2.10 * u.deepFreq + t * 0.55 * u.deepSpeed);
    v = v + sin((p.x - p.y) * 1.25 * u.deepFreq + t * 0.34 * u.deepSpeed);
    return v * (1.0 / 6.0) + 0.5;
}

fn plasmaBright(p: vec2<f32>, t: f32) -> f32 {
    var v = 0.0;
    v = v + sin(p.x * 4.40 * u.brightFreq + t * 1.30 * u.brightSpeed);
    v = v + sin(p.y * 5.40 * u.brightFreq + t * 1.55 * u.brightSpeed);
    v = v + sin((p.x + p.y) * 3.30 * u.brightFreq + t * 1.05 * u.brightSpeed);
    let c = vec2<f32>(sin(t * 0.42) * 0.7, cos(t * 0.58) * 0.55);
    v = v + sin(length(p - c) * 6.5 * u.brightFreq - t * 1.7 * u.brightSpeed);
    return v * 0.125 + 0.5;
}

// ---- Time-of-day cosine palettes --------------------------------------------
//
// Inigo Quilez cosine-gradient parameterization:
//   color(t) = a + b * cos(2pi * (c * t + d))
// Four keyframes around the day, smooth-stepped between adjacent pairs.
// Tuned for high-fashion natural light -- Golden Hour, Arctic Ice, Midnight --
// not 90s neon plasma.

struct CosPalette {
    a: vec3<f32>,
    b: vec3<f32>,
    c: vec3<f32>,
    d: vec3<f32>,
}

fn todPalette(tod: f32) -> CosPalette {
    // Midnight -- deep ink with cool gold accents
    var night: CosPalette;
    night.a = vec3<f32>(0.18, 0.16, 0.32);
    night.b = vec3<f32>(0.22, 0.20, 0.32);
    night.c = vec3<f32>(1.00, 1.00, 1.00);
    night.d = vec3<f32>(0.10, 0.40, 0.65);

    // Dawn -- soft pink + lavender + amber (golden-hour, low contrast)
    var dawn: CosPalette;
    dawn.a = vec3<f32>(0.62, 0.48, 0.55);
    dawn.b = vec3<f32>(0.40, 0.38, 0.48);
    dawn.c = vec3<f32>(1.00, 1.00, 1.00);
    dawn.d = vec3<f32>(0.10, 0.30, 0.55);

    // Day -- champagne + soft cyan + gold (high-key, airy)
    var day: CosPalette;
    day.a = vec3<f32>(0.65, 0.62, 0.55);
    day.b = vec3<f32>(0.38, 0.42, 0.55);
    day.c = vec3<f32>(1.00, 1.00, 1.00);
    day.d = vec3<f32>(0.20, 0.45, 0.85);

    // Sunset -- burnt orange + magenta + violet (dramatic)
    var sunset: CosPalette;
    sunset.a = vec3<f32>(0.62, 0.40, 0.45);
    sunset.b = vec3<f32>(0.50, 0.42, 0.50);
    sunset.c = vec3<f32>(1.00, 1.00, 1.00);
    sunset.d = vec3<f32>(0.10, 0.55, 0.95);

    let seg = fract(tod) * 4.0;
    let idx = floor(seg);
    let t = smoothstep(0.0, 1.0, seg - idx);

    // WGSL select() does not work on user structs -- use if/else for selection.
    var pa: CosPalette;
    var pb: CosPalette;
    if (idx < 1.0) {
        pa = night; pb = dawn;
    } else if (idx < 2.0) {
        pa = dawn;  pb = day;
    } else if (idx < 3.0) {
        pa = day;   pb = sunset;
    } else {
        pa = sunset; pb = night;
    }

    var out: CosPalette;
    out.a = mix(pa.a, pb.a, t);
    out.b = mix(pa.b, pb.b, t);
    out.c = mix(pa.c, pb.c, t);
    out.d = mix(pa.d, pb.d, t);
    return out;
}

fn paletteAt(t: f32, p: CosPalette) -> vec3<f32> {
    return p.a + p.b * cos(6.2831853 * (p.c * t + p.d));
}

// ---- Fragment ---------------------------------------------------------------

@fragment fn fs_main(in: VSOut) -> @location(0) vec4<f32> {
    // Coordinate derivation: verbatim 1:1 with Plasma.metal fragment.
    //   p = in.uv * 2.0 - 1.0
    //   p.x *= resolution.x / max(resolution.y, 1.0)
    var p = in.uv * 2.0 - vec2<f32>(1.0);
    p.x = p.x * (u.resolution.x / max(u.resolution.y, 1.0));

    let tFlow   = u.time * 0.30;     // overall flow speed -- viscous
    let tBright = u.time * 0.40;     // bright layer slightly faster

    // ---- Domain warping ----
    //
    // Sample the deep layer at two offsets to produce a 2D vector field.
    // Use that to displace the coordinates the bright layer is evaluated at.
    // The bright detail now flows through the deep layer currents -- turbulent,
    // organic swirls instead of two independently-moving sheets.
    let warpVec = vec2<f32>(
        plasmaDeep(p + vec2<f32>(0.13, 0.00), tFlow),
        plasmaDeep(p + vec2<f32>(0.00, 0.17), tFlow),
    ) - vec2<f32>(0.5);              // -0.5..0.5
    let warpStrength = 0.85;
    let pWarp = p + warpVec * warpStrength;

    // ---- Multi-tap blur with motion smear ----
    //
    // 3 spatial taps of the bright layer at staggered time offsets.
    // Center + +x + +y preserves velocity-smear and spatial blur.
    var blurTaps = array<vec2<f32>, 3>(
        vec2<f32>( 0.000,  0.000),
        vec2<f32>( 0.014,  0.000),
        vec2<f32>( 0.000,  0.014),
    );
    var timeOffsets = array<f32, 3>( 0.000, -0.024, -0.048 );
    var hBright = 0.0;
    for (var i: i32 = 0; i < 3; i = i + 1) {
        hBright = hBright + plasmaBright(pWarp + blurTaps[i], tBright + timeOffsets[i]);
    }
    hBright = hBright / 3.0;

    // Deep layer at the un-warped position -- provides the slow tonal
    // foundation that the bright detail dances over.
    let hDeep = plasmaDeep(p, tFlow);

    // Linear weighted mix -- domain warping has already done the intertwining.
    let h = mix(hDeep, hBright, 0.58);

    // ---- Surface normals from height field ----
    //
    // Forward-difference using already-computed h as the base value.
    // Warp vector is global so the offset samples still see the same flow
    // distortion -- normal remains coherent with the warped field.
    let eps = 0.012;
    let h_xp = mix(plasmaDeep(p + vec2<f32>(eps, 0.0), tFlow),
                   plasmaBright(pWarp + vec2<f32>(eps, 0.0), tBright), 0.58);
    let h_yp = mix(plasmaDeep(p + vec2<f32>(0.0, eps), tFlow),
                   plasmaBright(pWarp + vec2<f32>(0.0, eps), tBright), 0.58);
    let dhdx = (h_xp - h) / eps;
    let dhdy = (h_yp - h) / eps;
    let heightScale = 0.20;
    let normal = normalize(vec3<f32>(-dhdx * heightScale, -dhdy * heightScale, 1.0));

    // ---- Thin-film iridescence ----
    //
    // Shift the palette sample position based on view-angle. At grazing angles
    // (NdotV -> 0), the palette steps forward into the next color band --
    // mimics wavelength-dependent reflection (oil slick, soap bubble).
    let viewDir = vec3<f32>(0.0, 0.0, 1.0);
    let NdotV = clamp(dot(normal, viewDir), 0.0, 1.0);
    // u.iris scales the gain (Metal: pow(1-NdotV,1.4)*0.18)
    let irisShift = pow(1.0 - NdotV, 1.4) * 0.18 * u.iris;

    // ---- TOD-driven cosine palette ----
    let pal = todPalette(u.timeOfDay);
    var col = paletteAt(h + u.time * 0.018 + irisShift, pal);

    // ---- Deep volume absorption ----
    //
    // Treat (1 - h) as density. Valleys (low h) get darker and more saturated.
    // Crests (high h) stay light and translucent.
    let density = 1.0 - h;
    // u.absorb scales the absorption strength (Metal: mix(1.0, 0.62, density))
    // absorb=1 -> original; absorb=0 -> no darkening; >1 -> stronger absorption
    col = col * mix(1.0, mix(1.0, 0.62, u.absorb), density);
    {
        let lum = dot(col, vec3<f32>(0.2126, 0.7152, 0.0722));
        col = mix(col, mix(vec3<f32>(lum), col, 1.18), density);  // saturate valleys
    }

    // ---- Lambertian diffuse ----
    let keyDir  = normalize(vec3<f32>( 0.45,  0.55,  0.70));
    let fillDir = normalize(vec3<f32>(-0.40,  0.30,  0.85));
    let NdotKey  = clamp(dot(normal, keyDir),  0.0, 1.0);
    let NdotFill = clamp(dot(normal, fillDir), 0.0, 1.0);
    let diffuse  = NdotKey * 0.55 + NdotFill * 0.20 + 0.45;
    col = col * diffuse;

    // ---- Anisotropic silk specular with thread modulation ----
    //
    // Tight Blinn-Phong glints catch the wave crests; smooth 1D sinusoidal
    // modulation along the flow direction makes them shimmer like light
    // catching individual silk threads.
    //
    // Three guards:
    //   (1) Gate by gradient magnitude -- at saddle/flat points flowDir is
    //       undefined; thread modulation goes to 1.0 (no starburst striations).
    //   (2) Apply ONLY to the tight primary glint (pow=96), not the broad
    //       secondary (pow=32).
    //   (3) Low thread frequency (x3.0) and tight amplitude (0.92..1.08).
    let grad = vec2<f32>(dhdx, dhdy);
    let gradLen = length(grad);
    var flowDir: vec2<f32>;
    if (gradLen > 0.001) {
        flowDir = vec2<f32>(-grad.y, grad.x) / gradLen;
    } else {
        flowDir = vec2<f32>(1.0, 0.0);
    }
    let threadGate = smoothstep(0.6, 2.0, gradLen);    // (1)

    let threadCoord = dot(p * 3.0, flowDir) + u.time * 0.30;
    let thread1 = sin(threadCoord * 4.7) * 0.5 + 0.5;
    let thread2 = sin(threadCoord * 7.3 + 1.7) * 0.5 + 0.5;
    let threadNoise = thread1 * 0.65 + thread2 * 0.35;
    let threadMod   = mix(1.0, 0.92 + 0.16 * threadNoise, threadGate);

    let halfKey = normalize(keyDir + viewDir);
    let NdotH   = clamp(dot(normal, halfKey), 0.0, 1.0);
    let silkGlint  = pow(NdotH, 96.0);
    let silkColor = paletteAt(0.92, pal);
    // u.silk scales the specular gain (Metal: *1.6 primary, *0.50 secondary)
    col = col + silkColor * silkGlint * threadMod * 1.6 * u.silk;  // (2)

    // Secondary softer specular from the fill direction -- un-modulated.
    let halfFill = normalize(fillDir + viewDir);
    let NdotH2   = clamp(dot(normal, halfFill), 0.0, 1.0);
    let silk2    = pow(NdotH2, 32.0);
    col = col + vec3<f32>(0.85, 0.92, 1.05) * silk2 * 0.50 * u.silk;

    // ---- Subtle chromatic fringing ----
    //
    // Tiny per-channel offset of the height value. At high-contrast ridges,
    // R/G/B sample slightly different palette positions -> faint color
    // separation that reads as atmospheric haze refraction.
    {
        // u.chroma scales the 0.006 coefficient
        let ca = pow(1.0 - NdotV, 2.0) * 0.006 * u.chroma;
        let colR = paletteAt(h + u.time * 0.018 + irisShift + ca, pal);
        let colB = paletteAt(h + u.time * 0.018 + irisShift - ca, pal);
        col.r = mix(col.r, colR.r, 0.40);
        col.b = mix(col.b, colB.b, 0.40);
    }

    // ---- EDR top-end lift ----
    let lum = dot(col, vec3<f32>(0.2126, 0.7152, 0.0722));
    let edrBoost = smoothstep(0.75, 1.4, lum) * 1.2;
    col = col * (1.0 + edrBoost);

    // ---- Animated film-grain dither ----
    let n1 = fract(sin(dot(in.pos.xy, vec2<f32>(12.9898, 78.233)) + u.time) * 43758.5453);
    let n2 = fract(sin(dot(in.pos.xy, vec2<f32>(45.123,  89.456)) + u.time * 1.1) * 27182.818);
    let grain = (n1 + n2) * 0.5 - 0.5;
    col = col + grain * (1.0 / 200.0);

    // ---- Vignette ----
    // u.vignette scales the 0.30 coefficient (Metal: 1 - 0.30 * smoothstep(...))
    let vig = 1.0 - 0.30 * u.vignette * smoothstep(1.20, 2.05, length(p));
    col = col * vig;

    return vec4<f32>(max(col, vec3<f32>(0.0)), 1.0);
}
`;

// ---- HUD ------------------------------------------------------------------
const hud = window.SJHud.createHud({
  title:  'Plasma',
  build:  BUILD,
  canvas: canvas,
  help:   ['console: window.plas.*'],
  lines:  [],
});

// ---- Controls -------------------------------------------------------------
// Time model state
let elapsed = 0.0;

const ctrl = window.SJControls.create({
  title: 'Plasma',
  build: BUILD,
  ns: 'plas',
  controls: [
    { id: 'speed',       label: 'Speed',        type: 'slider', min: 0,   max: 3,   step: 0.01,  default: 1.0 },
    { id: 'deepFreq',    label: 'Deep Freq',     type: 'slider', min: 0,   max: 3,   step: 0.01,  default: 1.0 },
    { id: 'deepSpeed',   label: 'Deep Speed',    type: 'slider', min: 0,   max: 3,   step: 0.01,  default: 1.0 },
    { id: 'brightFreq',  label: 'Bright Freq',   type: 'slider', min: 0,   max: 3,   step: 0.01,  default: 1.0 },
    { id: 'brightSpeed', label: 'Bright Speed',  type: 'slider', min: 0,   max: 3,   step: 0.01,  default: 1.0 },
    { id: 'iris',        label: 'Iridescence',   type: 'slider', min: 0,   max: 2,   step: 0.01,  default: 1.0 },
    { id: 'absorb',      label: 'Absorption',    type: 'slider', min: 0,   max: 2,   step: 0.01,  default: 1.0 },
    { id: 'silk',        label: 'Silk',          type: 'slider', min: 0,   max: 2,   step: 0.01,  default: 1.0 },
    { id: 'chroma',      label: 'Chromatic Ab',  type: 'slider', min: 0,   max: 3,   step: 0.01,  default: 1.0 },
    { id: 'vignette',    label: 'Vignette',      type: 'slider', min: 0,   max: 1.5, step: 0.01,  default: 1.0 },
    { id: 'todMode',     label: 'ToD Mode',      type: 'select',
      options: ['Wall clock', 'Fast cycle', 'Manual'],
      // PlasmaScene.swift default: timeOfDayMode = .wallClock
      default: 'Wall clock' },
    { id: 'todPeriod',   label: 'ToD Period',    type: 'slider', min: 5,   max: 600, step: 1,     default: 60 },
    { id: 'todScrub',    label: 'ToD Scrub',     type: 'slider', min: 0,   max: 1,   step: 0.001, default: 0.0 },
    { id: 'paused',      label: 'Paused',        type: 'toggle', default: false },
    { id: 'restart',     label: 'Restart',       type: 'button',
      onClick: () => { elapsed = 0.0; } },
  ],
});

// ---- Time-of-day computation -----------------------------------------------
// Mirrors PlasmaScene.swift currentTimeOfDay():
//   .wallClock: seconds-of-day / 86400.0
//   .fastCycle: fract(elapsed / fastCyclePeriodSeconds)
//   .manual:    todScrub value directly
function computeTimeOfDay(elapsedSec) {
  const mode = ctrl.value('todMode');
  if (mode === 'Wall clock') {
    const now = new Date();
    const secsOfDay = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()
                    + now.getMilliseconds() / 1000.0;
    return secsOfDay / 86400.0;
  } else if (mode === 'Fast cycle') {
    const period = ctrl.value('todPeriod');
    const p = period > 0 ? period : 60;
    return (elapsedSec / p) - Math.floor(elapsedSec / p);  // fract
  } else {
    // Manual
    return ctrl.value('todScrub');
  }
}

// ---- Boot -----------------------------------------------------------------
async function main() {
  if (!navigator.gpu) {
    hud.report('WebGPU unavailable',
      'navigator.gpu is undefined. Needs Chrome/Edge 113+, Safari 18+, or Firefox Nightly with WebGPU enabled.');
    return;
  }

  let adapter = null;
  try { adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' }); }
  catch (e) { hud.report('requestAdapter() threw', (e && e.stack) || String(e)); return; }
  if (!adapter) {
    hud.report('No GPU adapter',
      'navigator.gpu.requestAdapter() returned null. The GPU may be blocklisted, or other WebGPU tabs are holding all adapters -- close them and reload.');
    return;
  }

  let device;
  try { device = await adapter.requestDevice(); }
  catch (e) { hud.report('requestDevice() failed', (e && e.stack) || String(e)); return; }

  device.lost.then(info =>
    hud.report('GPU device lost', info.reason + ' -- ' + info.message));
  device.addEventListener('uncapturederror', ev => {
    console.error('[plasma] uncaptured GPU error:', ev.error);
    hud.report('GPU validation error', String((ev.error && ev.error.message) || ev.error));
  });

  const ctx = canvas.getContext('webgpu');
  if (!ctx) { hud.report('No WebGPU canvas context', "canvas.getContext('webgpu') returned null."); return; }

  const format = navigator.gpu.getPreferredCanvasFormat();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    canvas.width  = Math.floor(window.innerWidth  * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    ctx.configure({ device, format, alphaMode: 'opaque' });
  }
  resize();
  window.addEventListener('resize', resize);

  // Compile shader and guard for errors.
  const module = device.createShaderModule({ label: 'Plasma', code: WGSL });

  // Chrome renamed compilationInfo() -> getCompilationInfo(); support both.
  // Calling a missing method unconditionally throws and masks the real error.
  const ciFn = module.getCompilationInfo ? module.getCompilationInfo.bind(module)
             : module.compilationInfo    ? module.compilationInfo.bind(module)
             : null;
  if (ciFn) {
    const info = await ciFn();
    const msgs = (info && info.messages) || [];
    const errs = msgs.filter(m => m.type === 'error');
    if (msgs.length) {
      console[errs.length ? 'error' : 'warn']('[plasma] WGSL messages:\n' +
        msgs.map(m => m.type + ' L' + m.lineNum + ':' + m.linePos + '  ' + m.message).join('\n'));
    }
    if (errs.length) {
      hud.report('WGSL compile error',
        errs.map(m => 'L' + m.lineNum + ':' + m.linePos + '  ' + m.message).join('\n'));
      return;
    }
  }

  // 64-byte uniform buffer (16 x f32).
  // Slot layout:
  //   [0]=time      [1]=_pad0=0    [2]=res.x        [3]=res.y
  //   [4]=timeOfDay [5]=deepFreq   [6]=deepSpeed     [7]=brightFreq
  //   [8]=brightSpeed [9]=iris     [10]=absorb        [11]=silk
  //   [12]=chroma   [13]=vignette  [14]=_pad1=0       [15]=_pad2=0
  const UNIFORM_BYTES = 64;
  const uni = new Float32Array(UNIFORM_BYTES / 4);  // 16 f32 slots
  const uniformBuf = device.createBuffer({
    size:  UNIFORM_BYTES,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });

  const bgl = device.createBindGroupLayout({
    entries: [{ binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } }],
  });
  const bindGroup = device.createBindGroup({
    layout: bgl,
    entries: [{ binding: 0, resource: { buffer: uniformBuf } }],
  });

  const pipeline = device.createRenderPipeline({
    label:  'Plasma',
    layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
    vertex:   { module, entryPoint: 'vs_main' },
    fragment: { module, entryPoint: 'fs_main', targets: [{ format }] },
    primitive: { topology: 'triangle-list' },
  });

  let lastT = performance.now();

  function renderFrame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    const paused      = ctrl.value('paused');
    const speed       = ctrl.value('speed');
    const deepFreq    = ctrl.value('deepFreq');
    const deepSpeed   = ctrl.value('deepSpeed');
    const brightFreq  = ctrl.value('brightFreq');
    const brightSpeed = ctrl.value('brightSpeed');
    const iris        = ctrl.value('iris');
    const absorb      = ctrl.value('absorb');
    const silk        = ctrl.value('silk');
    const chroma      = ctrl.value('chroma');
    const vignette    = ctrl.value('vignette');

    if (!paused) elapsed += dt * speed;

    const timeOfDay = computeTimeOfDay(elapsed);

    // Pack uniform buffer -- order MUST match WGSL struct field order.
    uni[0]  = elapsed;       // time
    uni[1]  = 0.0;           // _pad0
    uni[2]  = canvas.width;  // resolution.x
    uni[3]  = canvas.height; // resolution.y
    uni[4]  = timeOfDay;     // timeOfDay
    uni[5]  = deepFreq;      // deepFreq
    uni[6]  = deepSpeed;     // deepSpeed
    uni[7]  = brightFreq;    // brightFreq
    uni[8]  = brightSpeed;   // brightSpeed
    uni[9]  = iris;          // iris
    uni[10] = absorb;        // absorb
    uni[11] = silk;          // silk
    uni[12] = chroma;        // chroma
    uni[13] = vignette;      // vignette
    uni[14] = 0.0;           // _pad1
    uni[15] = 0.0;           // _pad2
    device.queue.writeBuffer(uniformBuf, 0, uni);

    const enc  = device.createCommandEncoder();
    const pass = enc.beginRenderPass({
      colorAttachments: [{
        view:       ctx.getCurrentTexture().createView(),
        loadOp:     'clear',
        storeOp:    'store',
        clearValue: { r: 0, g: 0, b: 0, a: 1 },
      }],
    });
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bindGroup);
    pass.draw(3);
    pass.end();
    device.queue.submit([enc.finish()]);

    hud.tick(now);
  }

  function frame(now) {
    try { renderFrame(now); }
    catch (e) { hud.report('Render-loop exception', (e && e.stack) || String(e)); return; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

main().catch(err => {
  console.error('[plasma] init failed:', err);
  hud.report('Init exception', (err && err.stack) || String(err));
});
</script>
