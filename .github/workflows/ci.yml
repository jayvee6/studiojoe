name: CI

on:
  pull_request:
    branches: [main]

jobs:
  html-lint:
    name: HTML Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run HTMLHint
        run: npx --yes htmlhint "*.html"

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir resolves absolute internal paths (/savers.html,
          # /savers/foo.html, /resume.html) against the local checkout
          # instead of hitting production. Previously --base-url forced
          # lychee to fetch https://studiojoe.dev for every internal
          # link, which made any new page a chicken-and-egg problem:
          # it couldn't pass CI until it was already deployed, and it
          # couldn't deploy until CI passed.
          args: >-
            --verbose
            --no-progress
            --root-dir ${{ github.workspace }}
            --exclude "https://cdnjs.cloudflare.com"
            --exclude "https://fonts.googleapis.com"
            --exclude "https://fonts.gstatic.com"
            --exclude "https://www.linkedin.com"
            '*.html'
            'savers/*.html'
          fail: true
