<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHARP Splat — WebGPU 3DGS Viewer</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0c;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;color:#e7b877}
  #c{width:100vw;height:100vh;display:block;cursor:grab}
  #c:active{cursor:grabbing}
  #hud{position:fixed;left:16px;top:14px;font-size:13px;line-height:1.5;letter-spacing:.02em;
    background:rgba(10,10,12,.55);backdrop-filter:blur(8px);padding:10px 14px;border-radius:10px;
    border:1px solid #2b2830;pointer-events:none}
  #hud b{color:#efe9df;font-weight:600}
  #hud .k{color:#9a958e}
  #err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:2rem;color:#e88}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <b>SHARP splat · boardwalk</b><br>
  <span class="k" id="stat">loading…</span><br>
  <span class="k">drag</span> orbit &nbsp; <span class="k">scroll</span> zoom &nbsp; <span class="k">right-drag</span> pan
</div>
<div id="err"></div>
<script type="module">
const SPLAT_URL = "boardwalk.splat";
const canvas = document.getElementById("c");
const hud = document.getElementById("stat");
const errEl = document.getElementById("err");
const fail = (m)=>{errEl.style.display="grid";errEl.textContent=m;throw new Error(m);};

if(!navigator.gpu) fail("WebGPU not available in this browser.");
const adapter = await navigator.gpu.requestAdapter();
if(!adapter) fail("No WebGPU adapter.");
const device = await adapter.requestDevice();
const ctx = canvas.getContext("webgpu");
const format = navigator.gpu.getPreferredCanvasFormat();
ctx.configure({device, format, alphaMode:"opaque"});

// ---- load .splat (32 bytes/gaussian: pos f32[3], scale f32[3], rgba u8[4], rot u8[4]) ----
hud.textContent = "downloading splat…";
const raw = new Uint8Array(await (await fetch(SPLAT_URL)).arrayBuffer());
const N = raw.length/32|0;
const fv = new Float32Array(raw.buffer);
hud.textContent = `preparing ${N.toLocaleString()} gaussians…`;

// packed per-gaussian GPU record: 4×vec4f (64B): [pos.xyz,opacity][covA.xyz(xx,xy,xz),0][covB.xyz(yy,yz,zz),0][rgb,0]
const G = new Float32Array(N*16);
const posArr = new Float32Array(N*3);
let cx=0,cy=0,cz=0;
for(let i=0;i<N;i++){
  const f = i*8;                 // float index (32B=8 floats)
  const b = i*32;                // byte index
  const px=fv[f],py=fv[f+1],pz=fv[f+2];
  const sx=fv[f+3],sy=fv[f+4],sz=fv[f+5];
  const r=raw[b+24]/255, g=raw[b+25]/255, bl=raw[b+26]/255, a=raw[b+27]/255;
  // quat (w,x,y,z) from u8 (rot_0..3 = w,x,y,z)
  let qw=(raw[b+28]-128)/128, qx=(raw[b+29]-128)/128, qy=(raw[b+30]-128)/128, qz=(raw[b+31]-128)/128;
  const ql=Math.hypot(qw,qx,qy,qz)||1; qw/=ql;qx/=ql;qy/=ql;qz/=ql;
  // rotation matrix (columns), then M=R*diag(s), Sigma=M*Mᵀ
  const r00=1-2*(qy*qy+qz*qz), r01=2*(qx*qy-qz*qw), r02=2*(qx*qz+qy*qw);
  const r10=2*(qx*qy+qz*qw),   r11=1-2*(qx*qx+qz*qz), r12=2*(qy*qz-qx*qw);
  const r20=2*(qx*qz-qy*qw),   r21=2*(qy*qz+qx*qw),   r22=1-2*(qx*qx+qy*qy);
  const m00=r00*sx, m01=r01*sy, m02=r02*sz;
  const m10=r10*sx, m11=r11*sy, m12=r12*sz;
  const m20=r20*sx, m21=r21*sy, m22=r22*sz;
  const xx=m00*m00+m01*m01+m02*m02;
  const xy=m00*m10+m01*m11+m02*m12;
  const xz=m00*m20+m01*m21+m02*m22;
  const yy=m10*m10+m11*m11+m12*m12;
  const yz=m10*m20+m11*m21+m12*m22;
  const zz=m20*m20+m21*m21+m22*m22;
  const o=i*16;
  G[o]=px;G[o+1]=py;G[o+2]=pz;G[o+3]=a;
  G[o+4]=xx;G[o+5]=xy;G[o+6]=xz;G[o+7]=0;
  G[o+8]=yy;G[o+9]=yz;G[o+10]=zz;G[o+11]=0;
  G[o+12]=r;G[o+13]=g;G[o+14]=bl;G[o+15]=0;
  posArr[i*3]=px;posArr[i*3+1]=py;posArr[i*3+2]=pz;
  cx+=px;cy+=py;cz+=pz;
}
const center=[cx/N,cy/N,cz/N];

// ---- GPU buffers ----
const gBuf = device.createBuffer({size:G.byteLength, usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});
device.queue.writeBuffer(gBuf,0,G);
const idxBuf = device.createBuffer({size:N*4, usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});
const uBuf = device.createBuffer({size:160, usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST}); // view(64)+proj(64)+focal(8)+viewport(8)+pad(16)

// ---- WGSL ----
const shader = device.createShaderModule({code:`
struct U { view:mat4x4f, proj:mat4x4f, focal:vec2f, viewport:vec2f };
@group(0) @binding(0) var<uniform> u:U;
@group(0) @binding(1) var<storage,read> gauss:array<vec4f>;   // 4 vec4 per gaussian
@group(0) @binding(2) var<storage,read> order:array<u32>;

struct VOut { @builtin(position) pos:vec4f, @location(0) col:vec4f, @location(1) uv:vec2f };

@vertex fn vs(@builtin(vertex_index) vi:u32, @builtin(instance_index) inst:u32)->VOut {
  var o:VOut;
  let gi = order[inst]*4u;
  let p0 = gauss[gi]; let cA = gauss[gi+1u]; let cB = gauss[gi+2u]; let cC = gauss[gi+3u];
  let center = p0.xyz; let opacity = p0.w;
  let cam = u.view * vec4f(center,1.0);
  if(cam.z >= -0.01){ o.pos=vec4f(0,0,2,1); return o; }      // behind camera → cull
  let clip = u.proj * cam;
  let lim = 1.3*clip.w;
  if(clip.z < -clip.w || abs(clip.x)>lim || abs(clip.y)>lim){ o.pos=vec4f(0,0,2,1); return o; }
  // 3D covariance
  let Vrk = mat3x3f(cA.x,cA.y,cA.z,  cA.y,cB.x,cB.y,  cA.z,cB.y,cB.z);
  // Jacobian of perspective at cam
  let J = mat3x3f(
    u.focal.x/cam.z, 0.0, -(u.focal.x*cam.x)/(cam.z*cam.z),
    0.0, u.focal.y/cam.z, -(u.focal.y*cam.y)/(cam.z*cam.z),
    0.0, 0.0, 0.0);
  let W = mat3x3f(u.view[0].xyz, u.view[1].xyz, u.view[2].xyz);
  let T = W * J;
  let cov = transpose(T) * Vrk * T;
  var a = cov[0][0]+0.3; var b = cov[0][1]; var c = cov[1][1]+0.3;
  let mid = 0.5*(a+c);
  let rad = sqrt(max(mid*mid - (a*c - b*b), 0.1));
  let l1 = mid+rad; let l2 = max(mid-rad, 0.1);
  let v1 = normalize(vec2f(b, l1-a));
  let v2 = vec2f(v1.y, -v1.x);
  let major = min(sqrt(2.0*l1), 1024.0) * v1;
  let minor = min(sqrt(2.0*l2), 1024.0) * v2;
  // quad corner
  let quad = array<vec2f,4>(vec2f(-1,-1),vec2f(1,-1),vec2f(-1,1),vec2f(1,1));
  let q = quad[vi];
  let ndc = clip.xy/clip.w;
  let offset = (q.x*major + q.y*minor) / u.viewport * 2.0;
  o.pos = vec4f(ndc + offset, 0.0, 1.0);
  o.col = vec4f(cC.xyz, opacity);
  o.uv = q * 2.0;                     // falloff in 2σ units
  return o;
}

@fragment fn fs(i:VOut)->@location(0) vec4f {
  let A = -dot(i.uv, i.uv);           // gaussian exponent
  if(A < -4.0){ discard; }
  let alpha = exp(A) * i.col.a;
  if(alpha < 0.004){ discard; }
  return vec4f(i.col.rgb*alpha, alpha);   // premultiplied
}`});

const pipe = device.createRenderPipeline({
  layout:"auto",
  vertex:{module:shader,entryPoint:"vs"},
  fragment:{module:shader,entryPoint:"fs",targets:[{format,blend:{
    color:{operation:"add",srcFactor:"one",dstFactor:"one-minus-src-alpha"},
    alpha:{operation:"add",srcFactor:"one",dstFactor:"one-minus-src-alpha"}}}]},
  primitive:{topology:"triangle-strip"},
});
const bind = device.createBindGroup({layout:pipe.getBindGroupLayout(0),entries:[
  {binding:0,resource:{buffer:uBuf}},{binding:1,resource:{buffer:gBuf}},{binding:2,resource:{buffer:idxBuf}}]});

// ---- math ----
const mul=(a,b)=>{const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;};
function lookAt(eye,ctr,up){
  const z=norm(sub(eye,ctr)),x=norm(cross(up,z)),y=cross(z,x);
  return new Float32Array([x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
    -dot(x,eye),-dot(y,eye),-dot(z,eye),1]);
}
function persp(fovy,asp,n,f){const t=1/Math.tan(fovy/2);return new Float32Array([t/asp,0,0,0, 0,t,0,0, 0,0,f/(n-f),-1, 0,0,f*n/(n-f),0]);}
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(...a)||1;return[a[0]/l,a[1]/l,a[2]/l];};

// ---- depth counting sort (16-bit) — far→near so alpha-over composites correctly ----
const idx=new Uint32Array(N), keys=new Float32Array(N);
function sortAsc(view){
  const z0=view[2],z1=view[6],z2=view[10],z3=view[14];
  let mn=1e30,mx=-1e30;
  for(let i=0;i<N;i++){const d=z0*posArr[i*3]+z1*posArr[i*3+1]+z2*posArr[i*3+2]+z3;keys[i]=d;if(d<mn)mn=d;if(d>mx)mx=d;}
  const scale=65535/((mx-mn)||1);const cnt=new Uint32Array(65536);
  const q=new Uint16Array(N);
  for(let i=0;i<N;i++){const k=Math.min(65535,Math.max(0,((keys[i]-mn)*scale)|0));q[i]=k;cnt[k]++;}
  let sum=0;for(let i=65535;i>=0;i--){const c=cnt[i];cnt[i]=sum;sum+=c;} // reverse prefix → far(min depth=large -z?)
  for(let i=0;i<N;i++){const k=q[i];idx[cnt[k]++]=i;}
  device.queue.writeBuffer(idxBuf,0,idx);
}

// ---- camera / interaction ----
// frame from ~the original SHARP capture viewpoint (near world origin), slightly
// off-axis so the parallax reads immediately.
const target=[...center];
let radius=Math.hypot(center[0],center[1],center[2])*1.05 || 4.0;
let theta=Math.PI-0.35;
let phi=Math.acos(Math.max(-1,Math.min(1,-center[1]/(radius||1))));
let lastView=null, dirty=true;
function view(){
  const eye=[target[0]+radius*Math.sin(phi)*Math.sin(theta),
             target[1]+radius*Math.cos(phi),
             target[2]+radius*Math.sin(phi)*Math.cos(theta)];
  return lookAt(eye,target,[0,-1,0]);   // OpenCV: y down
}
canvas.oncontextmenu=e=>e.preventDefault();
let drag=null;
canvas.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,b:e.button};canvas.setPointerCapture(e.pointerId);};
canvas.onpointerup=()=>drag=null;
canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(drag.b===2){const s=radius*0.0015;target[0]-=dx*s;target[1]+=dy*s;}
  else{theta-=dx*0.005;phi=Math.min(Math.PI-0.05,Math.max(0.05,phi-dy*0.005));}
  dirty=true;};
canvas.onwheel=e=>{radius*=Math.exp(e.deltaY*0.001);radius=Math.max(0.2,Math.min(50,radius));dirty=true;e.preventDefault();};

function resize(){const d=Math.min(devicePixelRatio,2);canvas.width=canvas.clientWidth*d;canvas.height=canvas.clientHeight*d;}
new ResizeObserver(resize).observe(canvas); resize();

hud.textContent = `${N.toLocaleString()} gaussians · WebGPU`;
let frames=0,fpsT=performance.now();
function frame(){
  const v=view();
  const asp=canvas.width/canvas.height;
  const fovy=Math.PI/180*55;
  const proj=persp(fovy,asp,0.1,200);
  const focalY=canvas.height/(2*Math.tan(fovy/2)), focalX=focalY; // square-ish
  if(dirty){ sortAsc(v); dirty=false; }
  const ub=new Float32Array(40);
  ub.set(v,0); ub.set(proj,16); ub[32]=focalX;ub[33]=focalY; ub[34]=canvas.width;ub[35]=canvas.height;
  device.queue.writeBuffer(uBuf,0,ub);
  const enc=device.createCommandEncoder();
  const pass=enc.beginRenderPass({colorAttachments:[{view:ctx.getCurrentTexture().createView(),
    clearValue:{r:0.04,g:0.04,b:0.05,a:1},loadOp:"clear",storeOp:"store"}]});
  pass.setPipeline(pipe); pass.setBindGroup(0,bind); pass.draw(4,N);
  pass.end(); device.queue.submit([enc.finish()]);
  frames++; const now=performance.now();
  if(now-fpsT>500){hud.textContent=`${N.toLocaleString()} gaussians · ${Math.round(frames*1000/(now-fpsT))} fps · WebGPU`;frames=0;fpsT=now;}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__splat={N,center};
</script>
</body>
</html>
